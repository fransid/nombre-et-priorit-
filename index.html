<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche 1 – Connaître le vocabulaire – 5ème – Fransid</title>
<style>
:root{--coral:#e9765f;--coral-d:#c95a44;--green:#1f4d3a;--yellow:#f4b740;--ok:#2e9e5b;--ko:#d64545;--ink:#25302b;--paper:#fffdf7;--grid:#cfe0ee}
*{box-sizing:border-box}
body{margin:0;font-family:Verdana,Geneva,sans-serif;color:var(--ink);line-height:1.55;
background:var(--paper) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{background:#fbf5e6;border:3px solid var(--green);border-radius:14px;padding:16px 20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
header img{width:230px;max-width:100%;height:auto;display:block}
.by{font-size:.95rem;color:var(--green);text-align:right}
.by b{font-size:1.05rem}
.banner{margin:16px 0;background:var(--coral);color:#fff;border-radius:6px 6px 0 0;padding:12px 18px;font-family:'Trebuchet MS',sans-serif;display:flex;gap:14px;align-items:center}
.banner .n1{background:#fff;color:var(--coral-d);font-weight:700;font-size:1.6rem;padding:2px 12px;border-radius:4px}
.banner h1{font-size:1.2rem;margin:0}
.audio{background:#fff;border:2px dashed var(--coral);border-radius:10px;padding:12px 16px;margin-bottom:18px}
.audio audio{width:100%;margin-top:6px}
.bar{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;border-radius:8px;padding:8px 16px;margin-bottom:16px;display:flex;justify-content:space-between;font-weight:700}
.ex{background:#fff;border:2px solid #e4d9c3;border-left:10px solid var(--coral);border-radius:10px;padding:16px 18px;margin-bottom:18px;box-shadow:3px 3px 0 #eadfc9}
.ex h2{margin:0 0 10px;font-size:1rem;display:flex;gap:12px;align-items:flex-start;font-family:'Trebuchet MS',sans-serif}
.badge{flex:none;background:var(--coral);color:#fff;border-radius:4px;min-width:38px;text-align:center;font-size:1.3rem;padding:0 6px}
.q{border-top:1px dotted #bbb;padding:10px 6px;border-radius:6px}
.q.ok{background:#e7f6ec;border:2px solid var(--ok)}
.q.ko{background:#fdeaea;border:2px solid var(--ko)}
.lab{font-weight:700;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{border:2px solid #ccc;border-radius:20px;padding:3px 12px;cursor:pointer;background:#fff}
.opts label.sel{border-color:var(--green);background:#eef5f0}
.q.ok .opts label.sel{background:var(--ok);border-color:var(--ok);color:#fff}
.q.ko .opts label.sel{background:var(--ko);border-color:var(--ko);color:#fff}
.opts.col{flex-direction:column;align-items:flex-start}
input[type=text]{font:inherit;padding:6px 10px;border:2px solid #aaa;border-radius:6px;width:min(100%,420px)}
input[type=text]:focus,button:focus-visible,label:focus-within{outline:3px solid var(--yellow)}
.q.ok input[type=text]{border-color:var(--ok);color:var(--ok);font-weight:700}
.q.ko input[type=text]{border-color:var(--ko);color:var(--ko);font-weight:700}
.chip{font:inherit;font-weight:700;width:46px;height:46px;border-radius:50%;border:2px solid var(--green);background:#fff;cursor:pointer}
.chip.on{background:var(--yellow)}
.q.ok .chip.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.q.ko .chip.on{background:var(--ko);color:#fff;border-color:var(--ko)}
.fb{margin-top:8px;font-size:.92rem}
.fb b{display:block}.q.ok .fb b{color:var(--ok)}.q.ko .fb b{color:var(--ko)}
.fb p{margin:4px 0 0;background:#fff;border-left:4px solid var(--yellow);padding:6px 10px;border-radius:0 6px 6px 0}
code{background:#f3efe2;padding:1px 6px;border-radius:4px}
.hint{font-size:.85rem;color:#666;margin:0 0 6px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:24px 0}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;color:#fff;background:var(--green)}
.btn.c{background:var(--coral)}.btn.y{background:var(--yellow);color:var(--ink)}.btn.g{background:#6b7a73}
.btn:hover{filter:brightness(1.1)}
footer{text-align:center;font-size:.9rem;color:var(--green);padding-bottom:24px}
@media(max-width:560px){header{justify-content:center}.by{text-align:center}}
</style>
</head>

<script>
const L=(n,max,z)=>{const a=[];for(let k=z?0:1;n*k<=max;k++)a.push(n*k);return a};
const R=(a,b)=>L(1,0).concat(Array.from({length:b-a+1},(_,i)=>a+i));
const K=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const rad=(lab,opts,ans,expl)=>({t:'r',lab,opts,ans,show:opts[ans],expl});
const ex=(lab,val,ops,show,expl)=>({t:'e',lab,val,ops,show,expl});
const li=(lab,ok,expl)=>({t:'l',lab,ok,show:ok[0].join(' ; '),expl});
const ch=(lab,max,ans,expl)=>({t:'c',lab,max,ans,show:ans.join(' ; '),expl});
const O4=['somme','différence','produit','quotient'];
const EX=[
{h:"Pour chaque expression, indique si c'est une somme, une différence, un produit ou un quotient.",p:"Repère la dernière opération effectuée (multiplication et division avant addition et soustraction, parenthèses d'abord).",q:[
rad('a. 57 × 3 + 2',O4,0,"On calcule d'abord 57 × 3 (la multiplication est prioritaire), puis on ajoute 2. La dernière opération est une addition : c'est une <b>somme</b> de 57 × 3 et de 2."),
rad('b. 57 − 3 × 2',O4,1,"On calcule d'abord 3 × 2 = 6, puis on soustrait : 57 − 6. La dernière opération est une soustraction : c'est une <b>différence</b> de 57 et de 3 × 2."),
rad('c. 5 × 7 × 3 + 2',O4,0,"5 × 7 × 3 est calculé en premier (= 105), puis on ajoute 2. Dernière opération : l'addition, donc une <b>somme</b>."),
rad('d. (57 × 3) + 2',O4,0,"Les parenthèses entourent 57 × 3, qui est calculé d'abord (comme sans parenthèses). La dernière opération est +2 : une <b>somme</b>."),
rad('e. (5 + 7) × (3 − 2)',O4,2,"On calcule les parenthèses : 5 + 7 = 12 et 3 − 2 = 1. Puis on multiplie 12 × 1. La dernière opération est une multiplication : un <b>produit</b> de deux facteurs."),
rad('f. (5 + 7) − 3 × 2',O4,1,"(5 + 7) = 12 et 3 × 2 = 6. La dernière opération est 12 − 6 : une <b>différence</b>.")]},
{h:"Traduis chaque phrase par une expression.",p:"Tu peux écrire × ou *, ÷ ou /, et la virgule ou le point pour les décimaux.",q:[
ex('A est la somme de 5 et 3,7. A =',8.7,1,'5 + 3,7',"« Somme » veut dire addition : A = 5 + 3,7, ce qui donne 8,7."),
ex('B est le produit de 4 par 9,2. B =',36.8,1,'4 × 9,2',"« Produit » veut dire multiplication : B = 4 × 9,2 = 36,8."),
ex('C est la différence de 18 et 6. C =',12,1,'18 − 6',"« Différence » veut dire soustraction. On écrit les nombres dans l'ordre de la phrase : C = 18 − 6 = 12 (6 − 18 serait faux)."),
ex('D est le quotient de 7 par 2. D =',3.5,1,'7 ÷ 2',"« Quotient » veut dire division. « 7 par 2 » : on divise 7 par 2. D = 7 ÷ 2 = 3,5.")]},
{h:"Même énoncé qu'à l'exercice précédent.",p:"Utilise des parenthèses quand c'est nécessaire.",q:[
ex('E est la différence de 45 et du quotient de 8 par 3. E =',45-8/3,2,'45 − (8 ÷ 3)',"Dernière opération : la différence entre 45 et le quotient 8 ÷ 3. E = 45 − (8 ÷ 3) ≈ 42,33. Les parenthèses sont facultatives car la division est prioritaire."),
ex('F est le produit de 13 par la différence de 29 et 6. F =',299,2,'13 × (29 − 6)',"La différence doit être calculée avant de multiplier : parenthèses obligatoires. F = 13 × (29 − 6) = 13 × 23 = 299. Sans parenthèses, 13 × 29 − 6 = 371 serait faux."),
ex('G est la somme du produit de 7 par 4 et de 50. G =',78,2,'7 × 4 + 50',"Le produit 7 × 4 = 28 est calculé d'abord, puis on additionne 50. G = 7 × 4 + 50 = 78."),
ex('H est le quotient de la somme de 89 et 0,6 par 4. H =',22.4,2,'(89 + 0,6) ÷ 4',"Il faut additionner avant de diviser : parenthèses obligatoires. H = (89 + 0,6) ÷ 4 = 89,6 ÷ 4 = 22,4.")]},
{h:"Traduis chaque expression par une phrase.",p:"Choisis la bonne phrase.",q:[
rad('a. 43 − 8 × 5 est…',['la somme de 43 et du produit de 8 par 5','la différence de 43 et du produit de 8 par 5','le produit de la différence de 43 et 8 par 5'],1,"8 × 5 est calculé en premier, puis soustrait de 43 : c'est la différence de 43 et du produit de 8 par 5 (= 3)."),
rad('b. 43 × 8 + 5 est…',['la somme du produit de 43 par 8 et de 5','le produit de 43 par la somme de 8 et 5','la différence de 43 et du produit de 8 par 5'],0,"43 × 8 est calculé d'abord, puis on ajoute 5 : c'est la somme du produit de 43 par 8 et de 5 (= 349)."),
rad('c. (43 − 8) + 5 est…',['la différence de 43 et de la somme de 8 et 5','le produit de 43 par la somme de 8 et 5','la somme de la différence de 43 et 8, et de 5'],2,"On calcule 43 − 8 = 35 entre parenthèses, puis on ajoute 5 : somme de la différence de 43 et 8, et de 5 (= 40). La première phrase correspondrait à 43 − (8 + 5)."),
rad('d. 43 × (8 + 5) est…',['la somme du produit de 43 par 8 et de 5','le produit de 43 par la somme de 8 et 5','la somme de 43 et du produit de 8 par 5'],1,"On calcule 8 + 5 = 13 entre parenthèses, puis on multiplie 43 × 13 = 559 : produit de 43 par la somme de 8 et 5.")]},

li('b. Écris tous les multiples de 9, inférieurs à 90.',[L(9,89,1),L(9,89,0)],"9 × 0 = 0, 9 × 1 = 9… jusqu'à 9 × 9 = 81. Le suivant, 90, est exclu. Liste : 0, 9, 18, …, 81."),

li('c. Écris les nombres qui apparaissent dans les deux listes.',[[1,2,5,10]],"Nombres communs : 1, 2, 5 et 10. Remarque : ce sont les diviseurs communs de 20 et 30, et 10 est le plus grand d'entre eux. Ce sont aussi les diviseurs de 10.")]}
];
let Q=[];
const sorted=a=>[...new Set(a)].sort((x,y)=>x-y).join(',');
function calc(s){s=s.replace(/[×x*]/gi,'*').replace(/[÷:\/]/g,'/').replace(/[−–]/g,'-').replace(/,/g,'.').replace(/\s/g,'');
 if(!/^[0-9.+\-*\/()]+$/.test(s))return null;try{const v=Function('"use strict";return ('+s+')')();return{v,n:(s.match(/[+\-*\/]/g)||[]).length}}catch(e){return null}}
function render(){
 const m=document.getElementById('main');m.innerHTML='';Q=[];let c=0;
 EX.forEach((e,i)=>{const s=document.createElement('section');s.className='ex';
  s.innerHTML='<h2><span class="badge">'+(i+1)+'</span><span>'+e.h+'</span></h2>'+(e.p?'<p class="hint">'+e.p+'</p>':'');
  e.q.forEach(q=>{q.id=c++;const d=document.createElement('div');d.className='q';
   let h='<div class="lab">'+q.lab+'</div>';
   if(q.t=='r')h+='<div class="opts'+(q.opts[0].length>12?' col':'')+'">'+q.opts.map((o,k)=>'<label><input type="radio" name="q'+q.id+'" value="'+k+'"> '+o+'</label>').join('')+'</div>';
   else if(q.t=='c')h+='<div class="opts">'+Array.from({length:q.max},(_,k)=>'<button type="button" class="chip" data-v="'+(k+1)+'">'+(k+1)+'</button>').join('')+'</div>';
   else h+='<input type="text" autocomplete="off" placeholder="'+(q.t=='e'?'ton expression':'ex. 1 ; 2 ; 3')+'">';
   d.innerHTML=h+'<div class="fb"></div>';q.el=d;s.appendChild(d);Q.push(q);
   if(q.t=='r')d.querySelectorAll('input').forEach(x=>x.onchange=()=>{d.querySelectorAll('label').forEach(l=>l.classList.remove('sel'));x.parentNode.classList.add('sel');check(q,1)});
   else if(q.t=='c')d.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{b.classList.toggle('on');check(q,0)});
   else d.querySelector('input').onchange=()=>check(q,1)});
  m.appendChild(s)});
 upd()}
function get(q){const d=q.el;
 if(q.t=='r'){const x=d.querySelector('input:checked');return x?+x.value:null}
 if(q.t=='c')return[...d.querySelectorAll('.chip.on')].map(b=>+b.dataset.v);
 const v=d.querySelector('input').value.trim();return v||null}
function check(q,force){const v=get(q);let ok=false;
 if(q.t=='c'){if(!v.length&&!force)return;if(v.length<q.ans.length&&!force)return;ok=sorted(v)==sorted(q.ans)}
 else if(v===null){if(!force)return}
 else if(q.t=='r')ok=v==q.ans;
 else if(q.t=='e'){const r=calc(v);ok=!!r&&Math.abs(r.v-q.val)<1e-9&&r.n>=q.ops}
 else{const n=(v.match(/\d+/g)||[]).map(Number);ok=q.ok.some(a=>sorted(a)==sorted(n))}
 const d=q.el;d.classList.toggle('ok',ok);d.classList.toggle('ko',!ok);
 d.querySelector('.fb').innerHTML=(ok?'<b>✔ Bonne réponse !</b>':'<b>✘ Réponse incorrecte'+(v===null||v.length===0?' (pas de réponse)':'')+'.</b>Réponse attendue : <code>'+q.show+'</code>')+'<p>'+q.expl+'</p>';upd()}
function upd(){document.getElementById('score').textContent='Score : '+document.querySelectorAll('.q.ok').length+' / '+Q.length}
function checkAll(){Q.forEach(q=>check(q,1));document.querySelector('.bar').scrollIntoView({behavior:'smooth'})}
function corrige(){Q.forEach(q=>{const d=q.el;
 if(q.t=='r'){d.querySelectorAll('label').forEach(l=>l.classList.remove('sel'));const x=d.querySelectorAll('input')[q.ans];x.checked=true;x.parentNode.classList.add('sel')}
 else if(q.t=='c')d.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',q.ans.includes(+b.dataset.v)));
 else d.querySelector('input').value=q.show;
 check(q,1)})}
function dl(){const b=new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],{type:'text/html'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Fransid_5eme_Fiche1_vocabulaire.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();
</script>
